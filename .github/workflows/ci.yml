# Glideinbir — CI (built by Sahil Thakur)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://crm:crm@localhost:5432/crm
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Migrations are in sync
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (PostgreSQL, includes concurrency + DB-trigger tests)
        run: pytest -q --cov=apps --cov-report=term-missing:skip-covered
      - name: OpenAPI schema is valid
        run: python manage.py spectacular --file /dev/null --validate --fail-on-warn
      - name: Deploy checklist
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-checks-0123456789
          DJANGO_ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level ERROR
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements/prod.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
